<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>郵便番号-住所検索</title>
  </head>
  <body>
    <h1>郵便番号から住所検索</h1>
    <form id="zipcode-form">
      <p>郵便番号を数字7桁で入力してください。ハイフンの有無は問いません。</p>
      <label for="zipcode" id="zipcode-icon">〒</label
      >
      <input
        type="text"
        id="zipcode"
        name="zipcode"
        placeholder="例: 1234567または123-4567"
      />
      <button type="submit">検索</button>
    </form>

    <div>
      <h2>検索結果</h2>
      <p id="status"></p>
      <button id="resetTbody">結果をリセット</button>
      <table id="addressesTable">
        <thead>
          <tr>
            <th>〒</th>
            <th>住所</th>
            <th>住所ｶﾅ</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script src="main.js"></script>
  </body>
</html>
